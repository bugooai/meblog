# ============================================================================
# meblog.bugooai.cn —— nginx 反向代理目标状态（HTTP-01 签发后的最终形态）
#
# 为什么有这个文件：浏览器敲 https:// 直接被拒（2026-10-15 17:27 实测 curl exit 7），
# 登录口令在公网上明文传。这一条是实测。
#
# 「线上 nginx 现在长什么样」**已经在机器上量过**（2026-10-15 17:59 UTC 只读登录，逐项记录在
# docs/HARDENING.md 第五节），不是推断：
#   - meblog 的 server block：`listen 80` + `server_name meblog.bugooai.cn`；
#     `location /` → `proxy_pass http://localhost:9001`；`/admin` → `http://localhost:9001/admin`；
#     `/api` → `http://localhost:9000`；另有一条 `location = /baidu_verify_codeva-*.html`
#   - `nginx -T` 里 **0 个 upstream 块** —— 线上走的是宿主机回环上的 compose 发布端口
#   - `ss -ltn | grep -c ":443"` → **0**；`/etc/letsencrypt` 不存在；`certbot` 未安装
#   - `sites-enabled/default` 第 27/28 行那两条 `listen 443 ssl default_server` 是注释状态，
#     而且在 **default** server 里，不是 meblog 那组
# 状态会漂（口令轮换后这条通道也会失效），动手前再跑一次这三条只读命令确认：
#   nginx -T 2>/dev/null | grep -E 'listen|server_name|proxy_pass|upstream'
#   certbot certificates
#   ls /etc/letsencrypt/live/ 2>/dev/null
#
# 两条落地路径，选一条就够：
#   A) 一条命令让 certbot 自己写配置（推荐，改动最小、可回滚）：
#        certbot --nginx -d meblog.bugooai.cn --redirect
#      它会备份原文件、加 443、加 80→443 跳转，并自动续期。
#   B) 用下面这份当目标状态手改：先只保留 80 那一段把证书签下来，
#      签成功后再把 `return 301` 那行取消注释。
#      注意手贴时要把 map + 两个 upstream 一起带上，只贴 server 段会在 reload 时报
#      host not found in upstream。
#
# !! 顺序坑：签证书（HTTP-01）走的是 80。80→443 跳转必须在签成功之后再打开，
#    否则验证请求会被跳走，签发直接失败。
#
# !! 端口对照坑（现在有答案了）：线上真实值是 `localhost:9001`（站点）/ `localhost:9000`（/api），
#    端口和下面两行一致，**但线上是按名字转的，没有 upstream 块**。所以这两行 upstream 是「目标形态」
#    而不是「现状」：搬这份文件过去等于顺手换一套寻址方式。两条注意：
#      1. `localhost` 是名字不是地址。Ubuntu 的 /etc/hosts 里它同时挂 127.0.0.1 和 ::1，
#         而 compose 的 `127.0.0.1:900x:` 绑定只建 IPv4 监听 —— 解析顺序一变就 502。
#         要显式绑定就把 nginx 里的地址一起写死成 `127.0.0.1:900x`，两步一起做完再 `nginx -t`。
#      2. 更稳的是走下面的路径 A：`certbot --nginx` 只在现有 location 结构上加 443，不重排寻址，
#         回滚就是一个 .bak 文件。手贴这份文件才会碰到上面那两个坑。
#
# !! 别整份拷贝：443 那段是活代码，证书还不存在时 `nginx -t` 会卡在 ssl_certificate 上报
#    cannot load certificate，reload 直接失败。走路径 B 就先只放 80 那一段；走路径 A
#    （certbot --nginx）根本不用拷这个文件，它只是目标形态的参考。
# ============================================================================

# 端口值已于 2026-10-15 17:59 UTC 在机器上核实（9001 站点 / 9000 API）；线上现状没有 upstream 块，
# 这两行是目标形态。复认命令见文件头，动之前跑一次。

# keepalive 和 websocket 的 Connection 头不能写死：写死 "upgrade" 会让每个普通请求都带
# Upgrade，上游 keepalive 直接失效；写死 "" 又把真的 websocket 升级掐掉了。按 $http_upgrade 取值才两全。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream meblog_frontend_prod {
    server 127.0.0.1:9001;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream meblog_backend_prod {
    server 127.0.0.1:9000;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# ---- 80：签发前只跑这一段；签发后只负责跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name meblog.bugooai.cn;

    # Let's Encrypt HTTP-01 用。certbot --nginx 模式不需要这段，--webroot 模式需要，
    # 而且要先 mkdir -p /var/www/certbot：目录不存在验证就是 404。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书到位以后再打开这一行（路径 A 的 --redirect 会自动加）。
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 25m;   # 上传上限默认 20 MB（MAX_UPLOAD_SIZE_MB），留余量

    location /api/ {
        proxy_pass http://meblog_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/ 这边没有 websocket，清掉 Connection 上游 keepalive 才生效。
        proxy_set_header Connection        "";
    }

    location / {
        proxy_pass http://meblog_frontend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# ---- 443：证书由 certbot 管，路径写死在 /etc/letsencrypt/live/<域名>/ ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meblog.bugooai.cn;

    server_tokens off;   # 不再对外报 nginx/1.18.0 (Ubuntu)，少给扫描的人一条信息
    ssl_certificate     /etc/letsencrypt/live/meblog.bugooai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meblog.bugooai.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # 如果 http 段里（nginx.conf 或别的 sites-available）已经定义过 shared:SSL，
    # 这行要删掉，否则 reload 报 duplicate zone。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 打开前先确认 https 真的能通，否则一次访问失败会被浏览器记住很久。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 站点地址：canonical / sitemap / og 全部按 https 输出。
    # 配 SITE_URL=http://meblog.bugooai.cn 的那两处 env 要一起改成 https，
    # 否则跳完 https 又拿到 http 的 canonical，等于白配（见 docs/DEPLOY.md）。
    proxy_set_header X-Forwarded-Proto https;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://meblog_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/ 这边没有 websocket，清掉 Connection 上游 keepalive 才生效。
        proxy_set_header Connection        "";
    }

    location / {
        proxy_pass http://meblog_frontend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
