# ============================================================================
# meblog.bugooai.cn —— nginx 反向代理目标状态（HTTP-01 签发后的最终形态）
#
# 为什么有这个文件：线上 server block 现在只有 `listen 80`，`sites-enabled/default`
# 里那行 `listen 443 ssl` 还是注释状态，`/etc/letsencrypt/` 不存在，certbot 没装。
# 结果是浏览器敲 https:// 直接被拒（2026-10-15 17:27 实测 curl exit 7），
# 登录口令在公网上明文传。
#
# 两条落地路径，选一条就够：
#   A) 一条命令让 certbot 自己写配置（推荐，改动最小、可回滚）：
#        certbot --nginx -d meblog.bugooai.cn --redirect
#      它会备份原文件、加 443、加 80→443 跳转，并自动续期。
#   B) 用下面这份当目标状态手改：先只保留 80 那一段把证书签下来，
#      签成功后再把 `return 301` 那行取消注释。
#
# !! 顺序坑：签证书（HTTP-01）走的是 80。80→443 跳转必须在签成功之后再打开，
#    否则验证请求会被跳走，签发直接失败。
#
# !! 端口对照坑：下面两个 upstream 端口是按 docs/DEPLOY.md 记录的 compose 映射写的
#    （后端 9000:8000、前端 9001:3000）。动手前先跑一次
#      grep -R -E 'server_name|proxy_pass|listen' /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
#    线上现有 upstream 地址要是和这里不一致，以线上为准，别照抄这份文件。
# ============================================================================

upstream meblog_frontend_prod {
    server 127.0.0.1:9001;
    keepalive 16;
}

upstream meblog_backend_prod {
    server 127.0.0.1:9000;
    keepalive 16;
}

# ---- 80：签发前只跑这一段；签发后只负责跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name meblog.bugooai.cn;

    # Let's Encrypt HTTP-01 用。certbot --nginx 模式不需要这段，--webroot 模式需要。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书到位以后再打开这一行（路径 A 的 --redirect 会自动加）。
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 25m;   # 上传上限默认 20 MB（MAX_UPLOAD_SIZE_MB），留余量

    location /api/ {
        proxy_pass http://memblog_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://memblog_frontend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---- 443：证书由 certbot 管，路径写死在 /etc/letsencrypt/live/<域名>/ ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meblog.bugooai.cn;

    ssl_certificate     /etc/letsencrypt/live/meblog.bugooai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meblog.bugooai.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 打开前先确认 https 真的能通，否则一次访问失败会被浏览器记住很久。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 站点地址：canonical / sitemap / og 全部按 https 输出。
    # 配 SITE_URL=http://meblog.bugooai.cn 的那两处 env 要一起改成 https，
    # 否则跳完 https 又拿到 http 的 canonical，等于白配（见 docs/DEPLOY.md）。
    proxy_set_header X-Forwarded-Proto https;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://memblog_backend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://memblog_frontend_prod;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
