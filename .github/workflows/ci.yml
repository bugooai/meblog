# github 侧 CI（首版 2026-10-17，CMP-14；第二条 job 同日加，CMP-15）。
#
# 口径：检查逻辑一律放 scripts/ 里，本地和 CI 跑同一条命令，不写在 workflow 的 inline run 里。
# 一条卡只加一条 job —— 首次落地就红一片的门禁等于没有门禁。
#
# 现在两条 job：
#   1) container-name-spelling —— 容器名拼写门禁（bash scripts/check-container-name-spelling.sh）
#   2) frontend-typecheck     —— 前端类型检查（bash scripts/check-frontend-types.sh）
#
# eslint / ruff 还没进来，各自基线量出来之前不进：
#   - eslint：配置是齐的（frontend/eslint.config.mjs，eslint 9 + eslint-config-next），
#     但 `npm run lint` 的脚本是光秃秃一个 `eslint`，不带文件参数；`eslint .` 在共享盘的
#     工作区 240 秒没跑完（exit 124 是我们自己 timeout 的，不是它报错）。
#     今天有多少 error / warning 还不知道，先量再决定是「一次清零」还是「只管新改动」。
#   - ruff：backend/pyproject.toml 里 dependencies、[dependency-groups].dev 都没有 ruff，
#     也没有 [tool.ruff] 段 —— 等于要先造工具链 + 选规则集，第一次跑必然红一片。
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-name-spelling:
    name: 容器名拼写门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 禁旧拼法（引用侧多一个 m 的那个）
        run: bash scripts/check-container-name-spelling.sh

  frontend-typecheck:
    name: 前端类型检查（tsc --noEmit）
    runs-on: ubuntu-latest
    # 单独一条 job、单独一个 timeout，不和 5 分钟的拼写门禁挤在一起：
    # 这条要冷装 543 个包 + 跑一遍全量 tsc，比拼写门禁慢一个量级。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工具链版本跟 frontend/Dockerfile 对齐（node:20-alpine + pnpm@9.15.9），
      # 不跟开发机对齐：这条 job 要检查的是「将要装进镜像发出去的那份依赖树」，
      # 版本一致才谈得上门禁。要升就两边一起升。
      #
      # 为什么不能顺手升到 pnpm 12（开发机上是 12.11.2）—— 2026-10-17 两条都实测过：
      #   1) 装依赖直接红：pnpm 10+ 默认拒绝跑依赖的 build 脚本，
      #      `pnpm install --frozen-lockfile` 报 ERR_PNPM_IGNORED_BUILDS
      #      （Ignored build scripts: sharp@0.34.5, unrs-resolver@1.11.1）。
      #      Dockerfile 第 15-17 行的注释就是 2026-10-15 踩的同一个坑，别再踩一遍。
      #      真要放行得逐个决定谁能跑 postinstall（--allow-build / onlyBuiltDependencies），
      #      那是供应链决定，会连带影响生产镜像，不该在一条 CI 卡里顺手做掉。
      #   2) 也不要在 frontend/package.json 里加 packageManager 字段来钉版本：
      #      实测加上 "packageManager": "pnpm@12.11.2" 之后 --frozen-lockfile 直接报
      #      ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE（pnpm 12 要把这个字段记进
      #      锁文件，于是认定现有锁文件过期）。不加字段时 --frozen-lockfile 通过，
      #      且 frontend/pnpm-lock.yaml 前后逐字节一致 —— 所以版本只钉在这里。
      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      # cache: pnpm 要求 pnpm 已经装好，所以上一步必须在它前面。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 装依赖（锁文件对不上就直接红，不自动改锁）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 类型检查（和本地同一条命令，口径写在脚本里）
        run: bash scripts/check-frontend-types.sh
