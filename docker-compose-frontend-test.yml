# ==========================
# meblog 前端 (Next.js) - 测试环境
# 使用: docker compose -f docker-compose-frontend-test.yml up -d
# ==========================
version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-test}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-}
    image: meblog-frontend-test:latest
    container_name: meblog-frontend-test
    restart: unless-stopped
    ports:
      - "8001:3000"
    environment:
      - NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV:-test}
      # 和生产同一套：运行时的站点地址、取数地址、刷新密钥都得进容器。
      # 留空是允许的 —— 空值等于没配，前端会走 app/lib/server-api.ts 里按
      # NEXT_PUBLIC_ENV=test 挑的默认地址（http://memblog-backend:8000/api/v1）。
      - SITE_URL=${SITE_URL:-}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-}
      - SERVER_API_BASE_URL=${SERVER_API_BASE_URL:-}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    networks:
      - common-network

networks:
  common-network:
    external: true

